function sendWhatsApp(){

var name=document.getElementById("name").value;
var phone=document.getElementById("phone").value;
var location=document.getElementById("location").value;
var specs=document.getElementById("specs").value;

var selected=[];
document.querySelectorAll('.products input:checked').forEach(el=>selected.push(el.value));

var msg="Hello IYKVIN FLEX TECHNICAL VENTURES%0A"
+"Name: "+name+"%0A"
+"Phone: "+phone+"%0A"
+"Location: "+location+"%0A"
+"Products: "+selected.join(", ")+"%0A"
+"Specs: "+specs;

window.open("https://wa.me/2348100573526?text="+msg);

}
