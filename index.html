<title>IYKVIN FLEX TECHNICAL VENTURES</title>

<style>

:root{
--gold:#d4af37;
}

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:black;
color:white;
}

.header img{
width:100%;
display:block;
}

.title{
text-align:center;
padding:15px;
border-bottom:3px solid var(--gold);
}

.title h1{
color:var(--gold);
margin:0;
}

.info{
text-align:center;
padding:20px;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
max-width:1100px;
margin:auto;
}

.gallery img{
width:100%;
border:2px solid var(--gold);
border-radius:6px;
}

.form-box{
max-width:900px;
margin:40px auto;
padding:25px;
background:#050505;
border:1px solid var(--gold);
}

.form-box h2{
text-align:center;
color:var(--gold);
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

input,select,textarea{
width:100%;
padding:12px;
background:#020617;
border:1px solid #333;
color:white;
}

textarea{
grid-column:span 2;
height:70px;
}

.product-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px 20px;
margin-top:10px;
}

button{
width:100%;
margin-top:20px;
padding:14px;
background:var(--gold);
border:none;
font-weight:bold;
cursor:pointer;
}

.map{
margin:40px auto;
max-width:900px;
border:2px solid var(--gold);
}

.map iframe{
width:100%;
height:300px;
border:0;

footer{
text-align:center;
padding:20px;
color:#aaa;
